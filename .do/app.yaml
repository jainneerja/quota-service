name: quota-service
services:
  - name: api
    github:
      repo: YOUR_GITHUB_USERNAME/quota-service   # <-- replace before deploying
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DB_HOST
        value: ${quota-db.HOSTNAME}
      - key: DB_PORT
        value: ${quota-db.PORT}
      - key: DB_NAME
        value: ${quota-db.DATABASE}
      - key: DB_USER
        value: ${quota-db.USERNAME}
      - key: DB_PASSWORD
        value: ${quota-db.PASSWORD}
        type: SECRET
    health_check:
      http_path: /actuator/health

databases:
  - name: quota-db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
